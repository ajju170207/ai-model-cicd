apiVersion: apps/v1
kind: Deployment

metadata:
  name: ai-model-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: ai-model

  template:
    metadata:
      labels:
        app: ai-model

    spec:
      containers:
        - name: ai-model-container

          image: ai-model:latest

          imagePullPolicy: Never

          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20

---

apiVersion: v1
kind: Service

metadata:
  name: ai-model-service

spec:
  type: NodePort

  selector:
    app: ai-model

  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30081